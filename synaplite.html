}
function togglePend(pid,tid){ const p=find(pid); if(!p) return; const it=(p.pendientes||[]).find(x=>x.id===tid); if(!it) return; it.done=!it.done; openPanes[pid]="pend"; save(); refresh(pid); }
function delPend(pid,tid){ const p=find(pid); if(!p) return; p.pendientes=(p.pendientes||[]).filter(x=>x.id!==tid); openPanes[pid]="pend"; save(); refresh(pid); }

function addComment(id){
  const p=find(id); if(!p) return;
  const el=document.getElementById(`cm-${id}`); const text=el?el.value.trim():"";
  if(!text){ if(el) el.focus(); return; }
  p.comentarios=p.comentarios||[]; p.comentarios.push({id:uid(),text,ts:new Date().toISOString()});
  openPanes[id]="com"; if(save()) toast("Comentario agregado","ok"); refresh(id);
}
function delComment(pid,cid){ const p=find(pid); if(!p) return; p.comentarios=(p.comentarios||[]).filter(x=>x.id!==cid); openPanes[pid]="com"; save(); refresh(pid); }

/* ---------------- resumen copiable ---------------- */
function copySummary(id){
  const p=find(id); if(!p) return;
  const L=[];
  L.push(`${p.name||"(sin nombre)"}${p.bed?` · Cama ${p.bed}`:""}${p.age?` · ${p.age} años`:""}${p.sex?` · ${p.sex}`:""}`);
  if(p.dx) L.push(`Dx: ${p.dx}`);
  if(p.att) L.push(`Adscrito: ${p.att}`);
  const soma=somaList(p).filter(x=>x.value!=="falta el sexo");
  if(soma.length) L.push(soma.map(x=>`${x.label} ${x.value}`).join(" · "));
  if(p.presentation) L.push(`\n${p.presentation}`);
  const v=lastVitals(p);
  if(v) L.push(`\nSV (${fmtTime(v.ts)}): `+SV_FIELDS.filter(f=>v[f.k]).map(f=>`${f.label} ${v[f.k]}`).join(", "));
  const lab=(p.labs||[]).slice(-1)[0];
  if(lab) L.push(`Labs (${fmtShort(lab.ts)}): `+labsToText(lab));
  const vm=lastVMA(p);
  if(p.onVMA&&vm) L.push(`VMA: `+VMA_FIELDS.filter(f=>vm[f.k]).map(f=>`${f.label} ${vm[f.k]}`).join(", "));
  const inf=activeInf(p);
  if(inf.length) L.push(`Infusiones: `+inf.map(i=>i.name+(i.dose?` ${i.dose}`:"")).join(", "));
  const meds=activeMeds(p);
  if(meds.length) L.push(`Medicamentos: `+meds.map(medText).join("; "));
  const pend=(p.pendientes||[]).filter(x=>!x.done);
  if(pend.length) L.push(`Pendientes: `+pend.map(x=>x.text).join("; "));
  const txt=L.join("\n");
  const done=()=>toast("Resumen copiado","ok");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  } else fallbackCopy(txt,done);
}
function fallbackCopy(txt,cb){
  const ta=document.createElement("textarea");
  ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); cb(); }catch(e){ toast("No se pudo copiar","err"); }
  ta.remove();
}

/* ---------------- archivos ---------------- */
function downscaleImage(dataURL,maxDim,quality){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.width,h=img.height; const scale=Math.min(1,maxDim/Math.max(w,h));
        w=Math.round(w*scale); h=Math.round(h*scale);
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        res(c.toDataURL("image/jpeg",quality));
      }catch(e){ rej(e); }
    };
    img.onerror=rej; img.src=dataURL;
  });
}
function addFiles(id,ev){
  const p=find(id); if(!p) return;
  const files=Array.prototype.slice.call(ev.target.files||[]); if(!files.length) return;
  p.archivos=p.archivos||[];
  let remaining=files.length;
  toast(files.length>1?`Procesando ${files.length} archivos…`:"Procesando archivo…");
  const finish=()=>{ remaining--; if(remaining<=0){ openPanes[id]="files"; if(save()) toast("Archivos guardados","ok"); refresh(id); } };
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const dataURL=reader.result;
      if(file.type&&file.type.indexOf("image/")===0){
        downscaleImage(dataURL,1400,0.7)
          .then(small=>{ p.archivos.push({id:uid(),name:file.name,type:"image/jpeg",ts:new Date().toISOString(),data:small}); finish(); })
          .catch(()=>{ p.archivos.push({id:uid(),name:file.name,type:file.type,ts:new Date().toISOString(),data:dataURL}); finish(); });
      } else {
        p.archivos.push({id:uid(),name:file.name,type:file.type||"application/octet-stream",ts:new Date().toISOString(),data:dataURL}); finish();
      }
    };
    reader.onerror=finish;
    reader.readAsDataURL(file);
  });
  ev.target.value="";
}
/* ---------- entrega de archivos al usuario ---------- */
/* Dentro del visor de Artifacts la página no puede descargar por su cuenta:
   hay que pasar por la capacidad `downloads`, que pide confirmación. Fuera del
   visor (archivo local o servidor propio) no existe `claude.use` y se mantiene
   la descarga directa de siempre, así que el archivo sirve en los dos sitios. */
let DL_READY=null;   // namespace de descargas si lo hay; sólo para rotular botones
async function getDownloads(){
  try{ return (window.claude && typeof window.claude.use==="function") ? await window.claude.use("downloads") : null; }
  catch(e){ return null; }
}
getDownloads().then(d=>{ DL_READY=d; });
function saveDirect(filename,blob){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=filename; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
/* "declined" es una decisión del usuario, no un fallo: no se anuncia como error. */
function dlErrMsg(e){
  const c=e&&e.code;
  if(c==="declined") return null;
  if(c==="too_large") return "El archivo es muy grande para guardarlo aquí.";
  if(c==="rate_limited") return "Espera un momento y vuelve a intentarlo.";
  return "No se pudo guardar el archivo.";
}
async function offerFile(filename,blob,okMsg){
  const dl=await getDownloads();          // memoizado: volver a pedirlo no cuesta
  if(dl){
    try{ await dl.save({filename,data:blob}); if(okMsg) toast(okMsg,"ok"); }
    catch(e){ const m=dlErrMsg(e); if(m) toast(m,"err",4200); }
    return true;
  }
  saveDirect(filename,blob);
  if(okMsg) toast(okMsg,"ok");
  return false;
}

function dataURLtoBlob(dataURL){
  const parts=dataURL.split(","); const mime=(parts[0].match(/:(.*?);/)||[])[1]||"application/octet-stream";
  const bin=atob(parts[1]); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
async function openFile(pid,fid){
  const p=find(pid); if(!p) return; const f=(p.archivos||[]).find(x=>x.id===fid); if(!f) return;
  let blob; try{ blob=dataURLtoBlob(f.data); }catch(e){ toast("No se pudo abrir el archivo","err"); return; }
  const dl=await getDownloads();
  if(dl){ await offerFile(f.name,blob); return; }   // el visor no abre pestañas: se guarda
  try{ const url=URL.createObjectURL(blob); window.open(url,"_blank"); setTimeout(()=>URL.revokeObjectURL(url),60000); }
  catch(e){ toast("No se pudo abrir el archivo","err"); }
}
function openLightbox(pid,fid){
  const p=find(pid); if(!p) return; const f=(p.archivos||[]).find(x=>x.id===fid); if(!f) return;
  document.getElementById("lightbox-img").src=f.data;
  document.getElementById("lightbox").classList.add("on");
}
function closeLightbox(){ document.getElementById("lightbox").classList.remove("on"); document.getElementById("lightbox-img").src=""; }
function delFile(pid,fid){ const p=find(pid); if(!p) return; p.archivos=(p.archivos||[]).filter(x=>x.id!==fid); openPanes[pid]="files"; save(); refresh(pid); }

/* ---------------- hoja de paciente ---------------- */
function resetDeleteUI(){ document.getElementById("del-confirm").style.display="none"; document.getElementById("del-btn").style.display="inline-flex"; }
function openAdd(){
  document.getElementById("sheet-title").textContent="Nuevo paciente";
  ["id","name","bed","age","sex","att","dx","peso","talla"].forEach(k=>document.getElementById("f-"+k).value="");
  document.getElementById("delete-zone").style.display="none"; resetDeleteUI();
  document.getElementById("overlay").classList.add("on");
  setTimeout(()=>document.getElementById("f-name").focus(),80);
}
function openEdit(id){
  const p=find(id); if(!p) return;
  document.getElementById("sheet-title").textContent="Editar paciente";
  document.getElementById("f-id").value=p.id;
  ["name","bed","age","sex","att","dx","peso","talla"].forEach(k=>document.getElementById("f-"+k).value=p[k]||"");
  document.getElementById("delete-zone").style.display="block"; resetDeleteUI();
  document.getElementById("overlay").classList.add("on");
}
function closeSheet(){ document.getElementById("overlay").classList.remove("on"); }
function askDelete(){ document.getElementById("del-btn").style.display="none"; document.getElementById("del-confirm").style.display="block"; }
function cancelDelete(){ resetDeleteUI(); }
function savePatient(){
  const id=document.getElementById("f-id").value;
  const data={ name:val("f-name"),bed:val("f-bed"),age:val("f-age"),sex:val("f-sex"),att:val("f-att"),dx:val("f-dx"),peso:val("f-peso"),talla:val("f-talla") };
  if(!data.name){ document.getElementById("f-name").focus(); toast("Escribe el nombre del paciente","err"); return; }
  if(id){ Object.assign(find(id),data); }
  else{ const np={id:uid(),...data,presentation:"",seenDate:null,seenAt:null,vitals:[],labs:[],vma:[],onVMA:false,infusiones:[],medicamentos:[],pendientes:[],comentarios:[],archivos:[]}; state.patients.push(np); selectedId=np.id; }
  if(save()) toast(id?"Paciente actualizado":"Paciente agregado","ok");
  closeSheet(); render();
}
function val(id){ const e=document.getElementById(id); return e?e.value.trim():""; }
function deletePatient(){
  const id=document.getElementById("f-id").value; if(!id){ closeSheet(); return; }
  state.patients=state.patients.filter(p=>p.id!==id); if(selectedId===id) selectedId=null; delete openPanes[id];
  save(); closeSheet(); render(); toast("Paciente eliminado");
}

/* ---------------- confirmaciones ---------------- */
/* El confirm() nativo no sirve dentro del visor de Artifacts: el iframe va en
   sandbox sin allow-modals, así que devuelve false en silencio y la acción se
   perdía sin decir nada. Esta hoja hace lo mismo con el HTML de la propia app,
   y funciona igual abierta como archivo suelto. */
let confirmCb=null;
function askConfirm(title,msg,okLabel,cb){
  confirmCb=cb;
  document.getElementById("confirm-title").textContent=title;
  document.getElementById("confirm-msg").textContent=msg||"";
  document.getElementById("confirm-ok").textContent=okLabel||"Continuar";
  document.getElementById("confirm-ov").classList.add("on");
}
function closeConfirm(){ document.getElementById("confirm-ov").classList.remove("on"); confirmCb=null; }

/* ---------------- respaldo ---------------- */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  offerFile("synapmed-pase-"+todayStr()+".json", blob, "Copia exportada");
}
function importData(ev){
  const file=ev.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(d&&Array.isArray(d.patients)){
        const hay=state.patients.length, vienen=d.patients.length;
        askConfirm("¿Reemplazar los datos de este dispositivo?",
          `Se sustituirán ${hay} paciente${hay===1?"":"s"} por ${vienen} de la copia. No se puede deshacer.`,
          "Sí, importar",
          ()=>{ state=d; save(); render(); toast(`Copia importada · ${vienen} paciente${vienen===1?"":"s"}`,"ok"); });
      } else toast("Archivo no válido","err");
    }catch(e){ toast("No se pudo leer el archivo","err"); }
    ev.target.value="";
  };
  r.readAsText(file);
}

/* ---------------- arranque ---------------- */
document.getElementById("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeSheet(); });
document.getElementById("confirm-ov").addEventListener("click",e=>{ if(e.target.id==="confirm-ov") closeConfirm(); });
document.getElementById("confirm-ok").addEventListener("click",()=>{ const cb=confirmCb; closeConfirm(); if(cb) cb(); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(document.getElementById("confirm-ov").classList.contains("on")) closeConfirm();
    else if(document.getElementById("lightbox").classList.contains("on")) closeLightbox();
    else if(document.getElementById("overlay").classList.contains("on")) closeSheet();
    else if(selectedId && !isDesktop()) closePatient();
  }
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||"");
  const modal=document.querySelector(".overlay.on,.lightbox.on");
  if(selectedId&&!typing&&!modal&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
    if(e.key==="ArrowLeft"||e.key==="ArrowUp"){ e.preventDefault(); navStep(-1); }
    if(e.key==="ArrowRight"||e.key==="ArrowDown"){ e.preventDefault(); navStep(1); }
  }
  if((e.key==="k"||e.key==="K")&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); document.getElementById("q").focus(); }
});

window.matchMedia("(min-width:900px)").addEventListener("change",()=>render());

paintThemeBtn();
/* Se comprueba al arrancar para avisar antes de que capture nada, no después. */
storageBroken=!storageOK();
paintStorageBar();
render();
