<script>
  // Tema aplicado antes de pintar para evitar parpadeo
  (function(){
    try{
      var t=localStorage.getItem("synapmed_theme");
      if(!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light";
      document.documentElement.setAttribute("data-theme",t);
    }catch(e){}
  })();

<style>
  /* ======================================================================
     Estilo Edu (sistema de diseño predeterminado). Los valores salen de

     añade como token. Nombres = tokens semánticos de Edu.
     ====================================================================== */
  :root[data-theme="light"]{
    --bg:#f8f9fa; --surface:#ffffff; --surface-sunken:#f4f7f9; --surface-deep:#1a3a5c;
    --text:#2c3e50; --text-muted:#62676b; --text-on-deep:#ffffff; --text-on-deep-muted:#b9cadf;
    --on-primary:#ffffff;
    --border:#dde2e6; --border-strong:#7a7f83;
    --primary:#749dbd; --primary-strong:#3c5e78; --primary-tint:#749dbd0d;
    --primary-soft:#d4e9f9; --primary-ink:#214158;            /* acero-100 / acero-800 */
    --secondary-strong:#526134; --secondary-soft:#e0ebcf;    /* olivo: tratamiento */
    --tertiary-strong:#49645b;  --tertiary-soft:#dbebe5;     /* salvia: criterios, pendientes */
    --accent:#e67e22; --accent-strong:#8c4700;
    --success:#2f6b45; --success-soft:#e7f3eb;
    --warning:#8c4700; --warning-soft:#fff5ee;
    --danger:#a8322a;  --danger-soft:#fbeceb;
    --info:#3c5e78;    --info-soft:#f0f8ff;
    --focus:#2b6cb0;   --focus-on-deep:#8ec5f2;

    --shadow-md:0 4px 12px rgba(26,58,92,0.08), 0 2px 4px rgba(26,58,92,0.05);
    --shadow-lg:0 12px 32px rgba(26,58,92,0.14);
    --scrim:rgba(26,58,92,0.45);
  }
  :root[data-theme="dark"]{
    --bg:#0e1b29; --surface:#16283b; --surface-sunken:#0a1520; --surface-deep:#1a3a5c;
    --text:#e3e9ef; --text-muted:#a7b3bf; --text-on-deep:#ffffff; --text-on-deep-muted:#9fb1c6;
    --on-primary:#072441;
    --border:#2a3c50; --border-strong:#6d7f92;
    --primary:#8bb0ce; --primary-strong:#a3c4de; --primary-tint:#749dbd1a;
    --primary-soft:#a3c4de33; --primary-ink:#d4e9f9;          /* en oscuro: tinte del -strong al 20 % */
    --secondary-strong:#b7c79c; --secondary-soft:#b7c79c33;
    --tertiary-strong:#b0cac1;  --tertiary-soft:#b0cac133;
    --accent:#f5954b; --accent-strong:#ffad72;
    --success:#7fc79a; --success-soft:#173326;
    --warning:#ffad72; --warning-soft:#3a2614;
    --danger:#f2958d;  --danger-soft:#3d1b19;
    --info:#a3c4de;    --info-soft:#132f45;
    --focus:#8ec5f2;   --focus-on-deep:#8ec5f2;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
    --shadow-md:0 4px 14px rgba(0,0,0,0.45);
    --shadow-lg:0 12px 32px rgba(0,0,0,0.55);
    --scrim:rgba(0,0,0,0.55);
  }
  :root{
    --font-serif:Cambria, Caladea, "Iowan Old Style", Georgia, serif;
    --font-sans:Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px; --radius-2xl:24px; --radius-full:9999px;
    --faint:var(--text-muted);   /* alias que usan estilos en línea del JS */
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);color:var(--text);font-family:var(--font-sans);
    font-size:16px;line-height:1.5;padding-bottom:104px;-webkit-font-smoothing:antialiased;
    transition:background .15s ease,color .15s ease;
  }
  .wrap{max-width:880px;margin:0 auto;padding:0 16px}
  button,input,textarea,select{font-family:inherit;outline:none}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--radius-md)}
  .edu-ico{width:24px;height:24px;flex:none}

  /* Estados clínicos: siempre palabra o flecha y forma, nunca sólo color.
     Vigilancia = triángulo, grave = cuadrado (BadgeEstado de Edu). */
  .pv.warn b::before,.vtile.warn .vl::before,.drv.warn em::before,.pvc.warn em::before,
  .pv.bad b::before,.vtile.bad .vl::before,.drv.bad em::before,.pvc.bad em::before,.chip.crit::before{
    content:"";display:inline-block;width:7px;height:7px;background:currentColor;margin-right:4px;vertical-align:1px;flex:none}
  .pv.warn b::before,.vtile.warn .vl::before,.drv.warn em::before,.pvc.warn em::before{clip-path:polygon(50% 0,100% 100%,0 100%)}
  .pv.bad b::before,.vtile.bad .vl::before,.drv.bad em::before,.pvc.bad em::before,.chip.crit::before{border-radius:1px}

  .pt-main{flex:1;min-width:0;cursor:pointer}
  .pt-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pt-name{font-family:var(--font-serif);font-weight:700;font-size:20px;line-height:1.3;word-break:break-word}
  .bedchip{min-width:36px;height:28px;padding:0 8px;border-radius:var(--radius-md);background:var(--surface-deep);color:var(--text-on-deep);
    display:inline-grid;place-items:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;flex:none}
  .pt-sub{font-size:14px;color:var(--text-muted);margin-top:2px}
  .pt-dx{font-size:15px;color:var(--text);margin-top:6px;line-height:1.4;word-break:break-word;font-weight:700}
  .seen-tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--success);background:var(--success-soft);border-radius:var(--radius-sm);padding:2px 8px}
  .seen-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

  /* Signos vitales en la tarjeta (edu-vital) */
  .sv-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .pv{background:var(--surface-sunken);border-radius:var(--radius-md);padding:4px 10px;display:inline-flex;align-items:baseline;gap:6px;line-height:1.35}
  .pv b{color:var(--text-muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:inline-flex;align-items:center}
  .pv span{font-weight:700;font-size:16px;color:var(--text);font-variant-numeric:tabular-nums}
  .pv.warn,.pv.warn span,.pv.warn b{color:var(--warning)} .pv.warn{background:var(--warning-soft)}
  .pv.bad,.pv.bad span,.pv.bad b{color:var(--danger)}   .pv.bad{background:var(--danger-soft)}
  .sv-pending{margin-top:10px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--warning);background:var(--warning-soft);border-radius:var(--radius-sm);padding:3px 8px}
  .sv-pending::before{content:"";width:7px;height:7px;background:currentColor;clip-path:polygon(50% 0,100% 100%,0 100%)}

  /* Chips de la tarjeta: color por contenido (acero, olivo, salvia), nunca naranja */
  .chips{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:var(--radius-lg);display:inline-flex;gap:5px;align-items:center;line-height:1.35}
  .chip.pend{color:var(--tertiary-strong);background:var(--tertiary-soft)}
  .chip.pend-0{color:var(--text-muted);background:var(--surface-sunken)}
  .chip.vma{color:var(--tertiary-strong);background:var(--tertiary-soft)}
  .chip.inf{color:var(--primary-strong);background:var(--primary-soft)}
  .chip.med{color:var(--secondary-strong);background:var(--secondary-soft)}
  .chip.file{color:var(--text-muted);background:var(--surface-sunken)}
  .chip.crit{color:var(--danger);background:var(--danger-soft);border-radius:var(--radius-sm)}
  .pane{display:none;padding-top:4px}
  .pane.active{display:block}

  /* Eyebrow de Edu: etiqueta en versalitas, primary-strong */
  .sec-title{font-size:12px;line-height:16px;font-weight:700;color:var(--primary-strong);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 8px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .stamp{font-size:12px;color:var(--text-muted);font-weight:400;text-transform:none;letter-spacing:0;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-full);padding:1px 8px;font-variant-numeric:tabular-nums}

  .vtiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .vtile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 12px}
  .vtile .vl{font-size:11px;line-height:14px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center}
  .vtile .vv{font-size:20px;line-height:26px;font-weight:700;color:var(--text);margin-top:2px;word-break:break-word;font-variant-numeric:tabular-nums}
  .vtile.warn{background:var(--warning-soft);border-color:var(--warning)} .vtile.warn .vv,.vtile.warn .vl{color:var(--warning)}
  .vtile.bad{background:var(--danger-soft);border-color:var(--danger)}    .vtile.bad .vv,.vtile.bad .vl{color:var(--danger)}
  .muted-note{color:var(--text-muted);font-size:14px;padding:10px 12px;background:var(--surface);border:1px dashed var(--border-strong);
    border-radius:var(--radius-md)}

  /* Campos (edu-field / edu-input) */
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:16px;font-weight:700;color:var(--text-muted);
    text-transform:uppercase;letter-spacing:.06em}
  .form-grid input{background:var(--surface);border:1.5px solid var(--border-strong);border-radius:var(--radius-md);color:var(--text);
    height:40px;padding:0 12px;font-size:16px;width:100%;font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0;font-weight:400}
  input:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
  input::placeholder,textarea::placeholder{color:var(--text-muted)}

  /* Botones (edu-btn) */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:var(--radius-md);
    font-size:15px;font-weight:700;height:40px;padding:0 16px;transition:filter .15s ease,background .15s ease;line-height:1;white-space:nowrap}
  .btn.primary{background:var(--primary-strong);color:var(--on-primary)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--surface);color:var(--primary-strong);border-color:var(--border-strong)}
  .btn.ghost:hover{background:var(--primary-tint);border-color:var(--primary-strong)}
  .btn.danger{background:var(--danger);color:var(--surface)}
  .btn.full{width:100%}
  .btn.sm{height:32px;padding:0 12px;font-size:14px}
  .btn svg{width:18px;height:18px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .mt{margin-top:12px}

  .hist{margin-top:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}
  .hist .hrow{display:flex;gap:12px;padding:8px 12px;border-top:1px solid var(--border);font-size:14px}
  .hist .hrow:first-child{border-top:none}
  .hist .hrow:nth-child(even){background:var(--surface-sunken)}
  .hist .hrow .ht{color:var(--text-muted);flex:none;min-width:88px;font-weight:700;font-size:13px;padding-top:1px;font-variant-numeric:tabular-nums}
  .hist .hrow .hv{color:var(--text);font-variant-numeric:tabular-nums}

  .note-line{font-size:14px;margin:12px 0 2px;color:var(--text-muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .note-line .on{color:var(--tertiary-strong);font-weight:700;display:inline-flex;align-items:center;gap:6px}
  .note-line .on::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}

  .pres-read{font-size:16px;line-height:1.6;color:var(--text);background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-md);padding:12px 14px;white-space:pre-wrap;word-break:break-word}
  .pres-area{width:100%;min-height:130px;background:var(--surface);border:1.5px solid var(--border-strong);border-radius:var(--radius-md);
    padding:12px;font-size:16px;line-height:1.55;color:var(--text);resize:vertical}

  /* Laboratorios (TablaLaboratorios de Edu): encabezado azul profundo, cebra, cifras tabulares a la derecha */
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);-webkit-overflow-scrolling:touch;background:var(--surface);box-shadow:var(--shadow-sm)}
  .labs-table{border-collapse:collapse;width:100%;font-size:14px;line-height:20px;min-width:320px;color:var(--text)}
  .labs-table th,.labs-table td{padding:8px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--border);font-variant-numeric:tabular-nums lining-nums}
  .labs-table thead th{background:var(--surface-deep);color:var(--text-on-deep);font-size:12px;line-height:16px;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;border-top:none}
  .labs-table thead th.now{color:var(--text-on-deep)}
  .labs-table thead th:not(.now):not(:first-child){color:var(--text-on-deep-muted)}
  .labs-table th:first-child,.labs-table td.lname{text-align:left;font-weight:700;color:var(--text);
    background:var(--surface);position:sticky;left:0;z-index:1}
  .labs-table thead th:first-child{background:var(--surface-deep);color:var(--text-on-deep)}
  .labs-table tbody tr:nth-child(even) td{background:var(--surface-sunken)}
  .labs-table td .num{font-weight:700;color:var(--text)}
  .labs-table td.old .num{font-weight:400}
  .labs-table td.old{color:var(--text-muted)}
  /* Semáforo: color = gravedad (vigilancia / grave), flecha = dirección (↑ alto, ↓ bajo) */
  .labs-table td .num.warn{color:var(--warning);font-weight:700}
  .labs-table td .num.bad{color:var(--danger);background:var(--danger-soft);border-radius:var(--radius-sm);padding:1px 6px;font-weight:700}
  .num.hi::after{content:" ↑"} .num.lo::after{content:" ↓"}
  .labs-table td .delta{display:block;font-size:11px;line-height:13px;font-weight:400;color:var(--text-muted)}

  .sub-title{font-size:12px;line-height:16px;font-weight:700;color:var(--primary-strong);text-transform:uppercase;letter-spacing:.06em;
    margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .drv-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .drv{font-size:14px;font-weight:700;color:var(--text);background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-md);padding:4px 10px;display:inline-flex;gap:6px;align-items:baseline;font-variant-numeric:tabular-nums}
  .drv em{font-style:normal;color:var(--text-muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:inline-flex;align-items:center}
  .drv.warn{color:var(--warning);background:var(--warning-soft);border-color:var(--warning)} .drv.warn em{color:var(--warning)}
  .drv.bad{color:var(--danger);background:var(--danger-soft);border-color:var(--danger)}    .drv.bad em{color:var(--danger)}

  .labs-table tr.grp td{background:var(--surface-sunken);font-size:11px;line-height:14px;font-weight:700;color:var(--primary-strong);
    text-transform:uppercase;letter-spacing:.06em;padding:6px 12px;text-align:left}
  .labs-table tr.grp td.lname{background:var(--surface-sunken);color:var(--primary-strong)}
  /* Vista previa del pegado: callout de dosis (barra acero, tinte 5 %) */
  .pv-box{margin-top:10px;border-left:4px solid var(--primary);border-radius:0 var(--radius-md) var(--radius-md) 0;background:var(--primary-tint);padding:12px 14px}
  .pv-head{font-size:12px;line-height:16px;font-weight:700;color:var(--primary-strong);text-transform:uppercase;letter-spacing:.06em}
  .pv-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pvc{font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:2px 8px;display:inline-flex;align-items:baseline}
  .pvc em{font-style:normal;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-right:5px;display:inline-flex;align-items:center}
  .pvc.warn{border-color:var(--warning);color:var(--warning);background:var(--warning-soft)} .pvc.warn em{color:var(--warning)}
  .pvc.bad{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}     .pvc.bad em{color:var(--danger)}
  .pv-warn{margin-top:8px;font-size:13px;color:var(--warning);background:var(--warning-soft);border-radius:var(--radius-sm);padding:6px 8px;word-break:break-word}
  .pv-box .muted-note{background:transparent;border:none;padding:6px 0;color:var(--text-muted)}

  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .thumb{position:relative;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--surface)}
  .thumb img{width:100%;height:104px;object-fit:cover;display:block;cursor:zoom-in}
  .thumb-cap{font-size:11px;color:var(--text-muted);padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thumb-del{position:absolute;top:4px;right:4px;background:var(--surface-deep);color:var(--text-on-deep);border:none;border-radius:50%;
    width:26px;height:26px;font-size:16px;line-height:1;padding:0}

  .cmt{position:relative;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:8px}
  .cmt-meta{font-size:12px;color:var(--text-muted);font-weight:700;margin-bottom:2px;text-transform:uppercase;letter-spacing:.06em;font-variant-numeric:tabular-nums}
  .cmt-text{font-size:16px;color:var(--text);white-space:pre-wrap;word-break:break-word;padding-right:28px;line-height:1.5}
  .cmt .del{position:absolute;right:4px;top:6px;color:var(--text-muted);background:none;border:none;font-size:22px;line-height:1;padding:2px 8px}
  .cmt .del:hover{color:var(--danger)}

  .items{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}
  .item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--border)}
  .item:first-child{border-top:none}
  .item .ic{width:26px;height:26px;border-radius:var(--radius-sm);border:1.5px solid var(--border-strong);flex:none;display:grid;place-items:center;
    color:transparent;background:var(--surface);padding:0;transition:background .15s ease}
  .item .ic:hover{border-color:var(--primary-strong)}
  .item .ic.on{background:var(--primary-strong);border-color:var(--primary-strong);color:var(--on-primary)}
  .item .ic.on.inf{background:var(--primary-strong);border-color:var(--primary-strong)}
  .item .ic.on.med{background:var(--secondary-strong);border-color:var(--secondary-strong)}
  .item .ic svg{width:16px;height:16px}
  .item .it{flex:1;font-size:16px;min-width:0;word-break:break-word}
  .item .it .dose{display:block;color:var(--text-muted);font-size:14px;margin-top:1px;font-variant-numeric:tabular-nums}
  .item.done .it{text-decoration:line-through;color:var(--text-muted)}
  .item.done .it .dose{text-decoration:line-through}
  .item .del{color:var(--text-muted);background:none;border:none;font-size:22px;line-height:1;padding:4px 8px;flex:none}
  .item .del:hover{color:var(--danger)}
  .add-row{display:flex;gap:8px;margin-top:10px}
  .add-row input{flex:1;background:var(--surface);border:1.5px solid var(--border-strong);border-radius:var(--radius-md);color:var(--text);
    height:40px;padding:0 12px;font-size:16px;min-width:0}

  /* Alta de medicamento: fármaco a lo ancho, luego dosis/vía/frecuencia en dos columnas */
  .med-add{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .med-add input{background:var(--surface);border:1.5px solid var(--border-strong);border-radius:var(--radius-md);color:var(--text);
    height:40px;padding:0 12px;font-size:16px;min-width:0;width:100%}
  .med-add .wide{grid-column:1/-1}

  /* Aviso fijo de almacenamiento: callout redflag / alerta de Edu */
  .sbar{font-size:14px;font-weight:700;line-height:1.35;padding:10px 12px;margin:0 0 12px;border-left:4px solid currentColor;
    border-radius:0 var(--radius-md) var(--radius-md) 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .sbar svg{width:20px;height:20px;flex:none}
  .sbar-msg{flex:1 1 180px;min-width:0}
  .sbar.err{color:var(--danger);background:var(--danger-soft)}
  .sbar.warn{color:var(--warning);background:var(--warning-soft)}
  .sbar .link{font-size:14px;font-weight:700;color:inherit;text-decoration:underline;background:none;border:none;padding:0;height:auto}

  .empty{text-align:center;color:var(--text-muted);font-size:15px;padding:40px 20px;border:1.5px dashed var(--border-strong);
    border-radius:var(--radius-lg);margin-top:12px;background:var(--surface)}
  .empty .big{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:var(--radius-lg);margin-bottom:12px;
    background:var(--primary-soft);color:var(--primary-strong)}
  .empty b{display:block;color:var(--text);font-family:var(--font-serif);font-size:18px;font-weight:700;margin-bottom:4px}

  .link{color:var(--primary-strong);font-size:14px;background:none;border:none;text-decoration:none;padding:8px 12px;
    border-radius:var(--radius-md);font-weight:700;transition:background .15s ease;display:inline-flex;align-items:center;gap:6px}
  .link:hover{background:var(--primary-tint)}
  .link svg{width:18px;height:18px}
  .toast{background:var(--surface-deep);color:var(--text-on-deep);font-size:15px;font-weight:700;padding:12px 16px;border-radius:var(--radius-md);
    box-shadow:var(--shadow-lg);max-width:440px;display:flex;align-items:center;gap:8px;transition:opacity .15s ease}
  .toast.ok{background:var(--success);color:var(--on-primary)} .toast.err{background:var(--danger);color:var(--on-primary)}
  .toast.out{opacity:0}

  /* ---------- Visor de imagen ---------- */
  .lightbox{position:fixed;inset:0;z-index:90;background:var(--surface-deep);display:none;align-items:center;justify-content:center;padding:20px}
  .lightbox.on{display:flex}
  .lightbox img{max-width:100%;max-height:88vh;border-radius:var(--radius-md)}
  .lightbox .close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:transparent;border:1.5px solid var(--text-on-deep-muted);
    color:var(--text-on-deep);width:44px;height:44px;border-radius:var(--radius-md);font-size:22px;line-height:1}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  /* ======================================================================
     Layout de aplicación web: barra superior + censo (izquierda) + paciente (derecha).
     Debajo de 900 px colapsa a lista → detalle (maestro/detalle).
     ====================================================================== */
  html,body{height:100%;overflow:hidden}
  body{padding-bottom:0}
  .app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
  .appbar{padding-top:env(safe-area-inset-top)}
  .head{display:flex;align-items:center;gap:12px;height:56px;padding:0 20px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand img{height:28px;width:auto;flex:none;display:block}
  .brand-txt{min-width:0}
  .brand-txt h1{margin:0;font-family:var(--font-serif);font-size:18px;font-weight:700;line-height:1.15;color:var(--text-on-deep)}
  .brand-txt p{margin:1px 0 0;font-size:13px;color:var(--text-on-deep-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .appbar{background:var(--surface-deep);color:var(--text-on-deep)}
  .appbar :focus-visible{outline-color:var(--focus-on-deep)}
  .head-actions{margin-left:auto;display:flex;gap:8px;flex:none}
  .hbtn{height:36px;padding:0 12px;border-radius:var(--radius-md);border:1.5px solid var(--text-on-deep-muted);background:transparent;
    color:var(--text-on-deep);display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;transition:background .15s ease}
  .hbtn:hover{background:#ffffff1a}
  .hbtn svg{width:18px;height:18px;flex:none}
  .hbtn.sq{width:36px;padding:0;justify-content:center}
  #storagebar:not(:empty){padding:12px 20px 0;background:var(--bg)}
  #storagebar .sbar{margin:0}

  .shell{display:grid;grid-template-columns:380px minmax(0,1fr);min-height:0}
  .side{display:flex;flex-direction:column;min-height:0;background:var(--bg);border-right:1px solid var(--border)}
  .side-top{padding:16px 16px 0;flex:none}
  .main{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--bg)}

  /* Resumen del pase */
  .board{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow-sm)}
  .board-top{display:flex;align-items:center;gap:14px}
  .ring{--pct:0;width:60px;height:60px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:conic-gradient(var(--success) calc(var(--pct)*1%), var(--border) 0);transition:background .3s ease}
  .ring-in{width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;line-height:1}
  .ring-in b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .board-meta{min-width:0}
  .board-meta h2{margin:0;font-family:var(--font-serif);font-size:17px;font-weight:700;line-height:1.25}
  .board-meta p{margin:2px 0 0;font-size:13px;color:var(--text-muted);line-height:1.35}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:var(--surface-sunken);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 10px;text-align:left;transition:box-shadow .15s ease}
  .stat:hover{box-shadow:var(--shadow-md)}
  .stat.on{border-color:currentColor;background:var(--surface)}
  .stat .n{font-size:21px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .stat .l{font-size:11px;color:var(--text-muted);margin-top:5px;font-weight:700;line-height:1.25;text-transform:uppercase;letter-spacing:.04em}
  .stat.a{color:var(--primary-strong)} .stat.b{color:var(--warning)} .stat.c{color:var(--tertiary-strong)}

  .chipbar{display:flex;gap:6px;overflow-x:auto;padding:12px 0 0;scrollbar-width:none}
  .chipbar::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;font-size:13px;font-weight:700;color:var(--primary-strong);background:var(--surface);
    border:1.5px solid var(--border-strong);height:32px;padding:0 11px;border-radius:var(--radius-full);display:inline-flex;align-items:center;gap:6px;transition:background .15s ease}
  .tab:hover{background:var(--primary-tint)}
  .tab .badge{font-size:11px;font-weight:700;background:var(--surface-sunken);color:var(--text-muted);border-radius:var(--radius-full);padding:0 7px;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
  .tab.active{color:var(--on-primary);background:var(--primary-strong);border-color:var(--primary-strong)}
  .tab.active .badge{background:var(--surface);color:var(--primary-strong)}

  .search{position:relative;margin:12px 0 0}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-muted)}
  .search input{width:100%;height:40px;background:var(--surface);border:1.5px solid var(--border-strong);border-radius:var(--radius-md);
    color:var(--text);padding:0 36px 0 38px;font-size:15px}
  .search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:700 11px var(--font-sans);color:var(--text-muted);
    border:1px solid var(--border);border-radius:var(--radius-sm);padding:1px 6px;pointer-events:none}
  .search.has kbd{display:none}
  .search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);font-size:22px;line-height:1;padding:6px 8px;display:none}
  .search.has .clear{display:block}

  .list-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;flex:none}
  .list-head .eyebrow{font-size:12px;font-weight:700;color:var(--primary-strong);text-transform:uppercase;letter-spacing:.06em}
  .list{flex:1;min-height:0;overflow-y:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
  .side-foot{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--bg)}
  .side-foot .btn{width:100%;height:44px}

  /* Fila de paciente */
  .prow{display:flex;align-items:flex-start;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--border);border-left:4px solid transparent;
    border-radius:var(--radius-md);cursor:pointer;transition:background .12s ease,box-shadow .12s ease}
  .prow:hover{box-shadow:var(--shadow-md)}
  .prow.sel{border-color:var(--primary);border-left-color:var(--primary-strong);background:var(--primary-tint);box-shadow:var(--shadow-sm)}
  .prow.done:not(.sel){background:var(--surface-sunken)}
  .prow.done .pt-name{color:var(--text-muted)}
  .prow .check{width:28px;height:28px;margin-top:1px}
  .prow .check svg{width:16px;height:16px}
  .prow-main{flex:1;min-width:0}
  .prow .pt-name{font-size:17px;line-height:1.25}
  .prow .bedchip{min-width:32px;height:24px;font-size:13px;padding:0 6px}
  .prow .pt-sub{font-size:13px}
  .prow .pt-dx{font-size:13.5px;margin-top:3px;font-weight:400;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .prow .chips{margin-top:8px;gap:5px}
  .prow .chip{font-size:11.5px;padding:2px 8px}
  .check{flex:none;border-radius:50%;border:1.5px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;color:transparent;transition:background .15s ease,border-color .15s ease;padding:0}
  .check:hover{border-color:var(--success)}
  .check.on{background:var(--success);border-color:var(--success);color:var(--on-primary)}

  /* Paciente */
  .dhead{flex:none;background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px 0}
  .dhead-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .dtitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;flex:1 1 280px}
  .dtitle .pt-name{font-size:26px;line-height:1.2}
  .dtitle .bedchip{height:32px;min-width:42px;font-size:17px}
  .dactions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
  .dpos{font-size:13px;font-weight:700;color:var(--text-muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 4px}
  .arrow{width:36px;height:36px;border-radius:var(--radius-md);border:1.5px solid var(--border-strong);background:var(--surface);color:var(--primary-strong);display:grid;place-items:center;transition:background .15s ease;padding:0}
  .arrow:hover:not(:disabled){background:var(--primary-tint)}
  .arrow:disabled{opacity:.45;cursor:not-allowed}
  .arrow svg{width:20px;height:20px}
  .btn.seen{background:var(--success);border-color:var(--success);color:var(--on-primary)}
  .dhead .pt-sub{font-size:15px;margin-top:6px}
  .dhead .pt-dx{font-size:17px;margin-top:4px}
  .dhead .sv-preview{margin-top:12px}
  .dhead .chips{margin-top:10px}
  .fb-back{display:none;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--primary-strong);background:var(--surface);
    border:1.5px solid var(--border-strong);border-radius:var(--radius-md);height:36px;padding:0 12px 0 8px}
  .fb-back svg{width:18px;height:18px}
  .seg{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:12px -24px 0;padding:0 24px}
  .seg::-webkit-scrollbar{display:none}
  .seg button{white-space:nowrap;font-size:14px;font-weight:700;color:var(--text-muted);background:none;border:none;border-bottom:3px solid transparent;
    padding:12px 14px 10px;transition:color .15s ease;display:inline-flex;align-items:center;gap:6px}
  .seg button:hover{color:var(--text)}
  .seg button .cnt{font-size:12px;font-weight:700;background:var(--surface-sunken);color:var(--text-muted);border-radius:var(--radius-full);padding:1px 7px;font-variant-numeric:tabular-nums}
  .seg button.active{color:var(--primary-strong);border-bottom-color:var(--primary-strong)}
  .seg button.active .cnt{background:var(--primary-soft);color:var(--primary-ink)}
  .seg button .dotv{width:7px;height:7px;border-radius:50%;background:var(--tertiary-strong)}
  .pane-area{flex:1;min-height:0;overflow-y:auto;padding:4px 24px 32px}
  .pane-area>.pane{display:block;max-width:1040px;padding-top:0}
  .cols2{display:grid;grid-template-columns:1fr;gap:0 24px}
  @media(min-width:1180px){ .cols2{grid-template-columns:1fr 1fr} }
  .main-empty{margin:auto;text-align:center;color:var(--text-muted);padding:40px 24px;max-width:380px}
  .main-empty .big{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:var(--radius-lg);margin-bottom:14px;background:var(--primary-soft);color:var(--primary-strong)}
  .main-empty .big svg{width:28px;height:28px}
  .main-empty b{display:block;color:var(--text);font-family:var(--font-serif);font-size:20px;margin-bottom:4px}
  .main-empty kbd,.kbd{font:700 12px var(--font-sans);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:1px 6px;color:var(--text)}

  /* Ventana modal */
  .overlay{position:fixed;inset:0;z-index:60;background:var(--scrim);display:none;align-items:center;justify-content:center;padding:16px}
  .overlay.on{display:flex}
  .sheet{width:100%;max-width:520px;background:var(--surface);border-radius:var(--radius-xl);padding:24px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
  .sheet h3{margin:0 0 4px;font-family:var(--font-serif);font-size:22px;font-weight:700;line-height:28px}
  .sheet label{display:block;font-size:12px;line-height:16px;font-weight:700;color:var(--text-muted);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.06em}
  .sheet input{width:100%;height:40px;background:var(--surface);border:1.5px solid var(--border-strong);border-radius:var(--radius-md);color:var(--text);padding:0 12px;font-size:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .menu{display:flex;gap:10px;margin-top:22px}
  .confirm-box{margin-top:14px;padding:14px;border-left:4px solid var(--danger);border-radius:0 var(--radius-md) var(--radius-md) 0;background:var(--danger-soft);text-align:center}
  .confirm-box p{margin:0 0 12px;font-size:15px;color:var(--text);font-weight:700}
  .confirm-msg{margin:6px 0 0;font-size:15px;line-height:1.5;color:var(--text-muted)}
  .toasts{position:fixed;left:0;right:0;bottom:24px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}

  @media(min-width:1500px){ .shell{grid-template-columns:420px minmax(0,1fr)} }
  @media(max-width:899px){
    .shell{grid-template-columns:minmax(0,1fr)}
    .side{border-right:none}
    .main{display:none}
    body.has-sel .side{display:none}
    body.has-sel .main{display:flex}
    .fb-back{display:inline-flex}
    .head{padding:0 16px}
    .hbtn .lbl{display:none}
    .hbtn{width:36px;padding:0;justify-content:center}
    .dhead{padding:12px 16px 0}
    .seg{margin:10px -16px 0;padding:0 16px}
    .pane-area{padding:4px 16px 32px}
    .dtitle .pt-name{font-size:22px}
    .dactions{margin-left:0;width:100%}
    .dactions .grow{flex:1}
    .vtiles{grid-template-columns:repeat(2,1fr)}
    .form-grid{grid-template-columns:repeat(2,1fr)}
    .search kbd{display:none}
  }
  @media(min-width:600px) and (max-width:899px){ .vtiles{grid-template-columns:repeat(4,1fr)} .form-grid{grid-template-columns:repeat(4,1fr)} }
  @media(min-width:900px){ .vtiles{grid-template-columns:repeat(4,1fr)} .form-grid{grid-template-columns:repeat(4,1fr)} }
  @media(min-width:1360px){ .form-grid{grid-template-columns:repeat(6,1fr)} }

</style>
</head>

function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d&&Array.isArray(d.patients)) return d; }catch(e){} return {patients:[]}; }
/* ¿Se puede escribir aquí? Abrir el archivo con doble clic (file:// o data:) deja
   localStorage inaccesible y el guardado falla siempre: hay que avisarlo de entrada
   y no cuando ya se capturó media visita. */
function storageOK(){
  try{ localStorage.setItem(KEY+"__t","1"); localStorage.removeItem(KEY+"__t"); return true; }
  catch(e){ return false; }
}
let unsaved=false;        // hubo un guardado fallido: lo capturado sólo vive en memoria
let storageBroken=false;  // el navegador no deja guardar aquí; se detecta al arrancar
function save(){
  try{
    const json=JSON.stringify(state);
    localStorage.setItem(KEY, json);
    unsaved=false; paintStorageBar(json.length);
    return true;
  }
  catch(e){
    /* Cuota llena y almacenamiento no disponible son problemas distintos y se
       arreglan distinto; antes los dos decían "almacenamiento lleno". */
    const full = e && (e.name==="QuotaExceededError" || e.name==="NS_ERROR_DOM_QUOTA_REACHED" || e.code===22 || e.code===1014);
    toast(full
      ? "No se pudo guardar: almacenamiento lleno. Exporta una copia y borra archivos pesados."
      : "No se pudo guardar: este navegador no permite guardar datos aquí. Exporta una copia para no perder lo capturado.",
      "err",6000);
    unsaved=true; paintStorageBar();
    return false;
  }
}
/* Barra fija: si algo quedó sin guardar hay que verlo siempre, no en un aviso que se va. */
function paintStorageBar(bytes){
  const el=document.getElementById("storagebar"); if(!el) return;
  let html="";
  if(storageBroken){
    html=`<div class="sbar err">${EDU_ICON.alerta}<span class="sbar-msg">Este navegador no guarda datos aquí: lo que captures se perderá al cerrar.</span>
      <button class="link" onclick="exportData()">Exporta una copia</button></div>`;
  } else if(unsaved){
    html=`<div class="sbar err">${EDU_ICON.alerta}<span class="sbar-msg">Hay cambios sin guardar en este dispositivo.</span>
      <button class="link" onclick="exportData()">Exporta una copia ahora</button></div>`;
  } else if(bytes && bytes>4e6){
    html=`<div class="sbar warn">${EDU_ICON.alerta}<span class="sbar-msg">Almacenamiento casi lleno (${(bytes/1048576).toFixed(1)} MB de ~5 MB).
      Exporta una copia y borra archivos pesados.</span></div>`;
  }
  if(el.innerHTML!==html){ el.innerHTML=html; }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
/* Fecha local (no UTC): un registro de las 22:00 debe contar como "hoy" */
function dayKey(d){ const x=(d instanceof Date)?d:new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function todayStr(){ return dayKey(new Date()); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Normaliza acentos, mayúsculas y dígitos en sub/superíndice. Base del buscador y del parser. */
function norm(s){ return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[₀-₉]/g,c=>"0123456789"["₀₁₂₃₄₅₆₇₈₉".indexOf(c)]).replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g,c=>"0123456789"["⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c)]); }
/* Quita unidades pegadas al número para que no compitan con las etiquetas.
   "Cr 1.2 mg/dL" -> "Cr 1.2" ; evita que mg/dL se lea como Magnesio.
   Ojo: la alternativa de x10^n exige la x o el ^, si no se comería valores como 106. */
/* El grupo inicial permite que la unidad venga pegada al número ("Cr 1.8mg/dL"):
   captura el carácter previo (dígito o espacio) y lo devuelve. Exigir \b como antes
   fallaba justo en ese caso, porque entre "8" y "m" no hay frontera de palabra.
   Al no aceptar una letra delante, sigue sin comerse unidades dentro de una etiqueta. */
const UNIT_RE=/(^|[^a-z])(?:mg\s*\/\s*dl|g\s*\/\s*dl|mg\s*\/\s*l|ng\s*\/\s*ml|pg\s*\/\s*ml|u\s*\/\s*l|ui\s*\/\s*l|mmol\s*\/\s*l|meq\s*\/\s*l|mosm\s*\/\s*kg|celulas\s*\/\s*ul|mmhg|cmh2o|x\s*10\s*[\^*]?\s*\d+(?:\s*\/\s*(?:ul|mm3|l))?|10\s*[\^*]\s*\d+(?:\s*\/\s*(?:ul|mm3|l))?|fl|pg|seg)\b/g;
/* Separa pares que vienen sólo con espacios de por medio ("Na 138 K 3.2" o una tabla
   pegada del laboratorio). Sólo corta después de un número suelto: exigir que venga
   precedido de espacio, ":" o "=" evita partir etiquetas como "HCO3 std". */
const PAIR_SPLIT_RE=/(^|[\s:=])([<>]?\s*-?\d+(?:\.\d+)?)\s+(?=[a-z])/g;
function cleanNum(raw){ return String(raw).trim().replace(/\s+/g,"").replace(",", "."); }
/* Lee un bloque de laboratorios pegado y devuelve {rec, unknown}. */
function parseLabText(text){
  const rec={}; const unknown=[];
  if(!text||!text.trim()) return {rec,unknown};
  let t=norm(text);
  t=t.replace(/(\d),(\d{3})(?!\d)/g,"$1$2");        // 95,000 -> 95000 antes de partir por comas
  /* Coma decimal: sólo cuando queda pegada entre dos dígitos. Como separador de lista
     siempre lleva espacio o letra después, así que "Cr 1,8, K 3,2" se lee bien.
     Sin esto, partir por comas dejaba "Cr 1" y tiraba el decimal en silencio. */
  t=t.replace(/(\d),(?=\d)/g,"$1.");
  const gasMatch=/gasometr[ií]a\s*(arterial|venosa|capilar)?/.exec(t);
  if(gasMatch) rec.gtipo=gasMatch[1]||"";
  t=t.replace(/gasometr[ií]a[^:,]*:/g," ");
  /* El tabulador separa etiqueta de valor (tablas y PDF del laboratorio), no dos datos:
     va a espacio, y de partir en pares ya se encarga PAIR_SPLIT_RE. */
  t=t.replace(/\t/g," ");
  t=t.replace(/[;\n\r()]/g,", ");
  t=t.replace(/\.(?=\s|$)/g,", ");                   // punto de fin de oración = separador
  t=t.replace(UNIT_RE,"$1 ").replace(/\s*%/g," ");
  t=t.replace(PAIR_SPLIT_RE,"$1$2, ");               // ya sin unidades, lo que sigue es otra etiqueta
  t.split(",").forEach(chunk=>{
    const c=chunk.trim(); if(!c) return;
    const m=/^([a-z0-9¿?\/\s\.\-]*?)\s*[:=]?\s*([<>]?\s*-?\d+(?:[.,]\d+)?)\s*$/.exec(c);
    if(!m){ if(/[a-z]/.test(c) && c.length<40) unknown.push(chunk.trim()); return; }
    const label=m[1].replace(/\s+/g," ").trim();
    const value=cleanNum(m[2]);
    if(!label) return;
    const hit=LAB_ALIASES.find(x=>x.al===label);
    if(hit){ if(rec[hit.k]===undefined) rec[hit.k]=value; }
    else unknown.push(chunk.trim());
  });
  if(rec.gtipo==="" ) { const anyGas=LAB_GROUPS.find(g=>g.gas).f.some(f=>f.k!=="gtipo"&&rec[f.k]); if(!anyGas) delete rec.gtipo; }
  return {rec,unknown};
}
/* Reconstruye el párrafo en el formato de la nota a partir de un set guardado. */
function labsToText(r){
  const out=[];
  LAB_GROUPS.filter(g=>!g.gas).forEach(g=>{
    const part=g.f.filter(f=>r[f.k]).map(f=>`${f.label} ${r[f.k]}`).join(", ");
    if(part) out.push(part);
  });
  let s=out.join(", ");
  if(s) s+=".";
  const gas=LAB_GROUPS.find(g=>g.gas);
  const gp=gas.f.filter(f=>f.k!=="gtipo"&&r[f.k]).map(f=>`${f.label} ${r[f.k]}${f.k==="so2"?"%":""}`).join(", ");
  if(gp) s+=(s?" ":"")+`Gasometría${r.gtipo?" "+r.gtipo:""}: ${gp}.`;
  return s;
}

/* ---------------- avisos ---------------- */
function toast(msg,type,ms){
  const box=document.getElementById("toasts");
  const el=document.createElement("div");
  el.className="toast"+(type?" "+type:"");
  el.textContent=msg;
  box.appendChild(el);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),250); }, ms||2200);
}

/* ---------------- rangos clínicos (solo para resaltar) ---------------- */
function num(v){ const n=parseFloat(String(v).replace(",",".").replace(/[^\d.\-]/g,"")); return isNaN(n)?null:n; }
function svStatus(k,v){
  if(v==null||v==="") return "";
  if(k==="ta"){
    const m=String(v).match(/(\d{2,3})\s*[\/\-]\s*(\d{2,3})/); if(!m) return "";
    const s=+m[1], d=+m[2];
    if(s<90||s>=180||d>=110) return "bad";
    if(s<100||s>=150||d>=95) return "warn";
    return "";
  }
  const n=num(v); if(n===null) return "";
  switch(k){
    case "fc":    return (n<50||n>130)?"bad":((n<60||n>100)?"warn":"");
    case "fr":    return (n<10||n>30)?"bad":(n>22?"warn":"");
    case "temp":  if(n>45) return "";  return (n<35||n>=39)?"bad":((n<36||n>=37.8)?"warn":"");
    case "sato2": if(n>100) return ""; return (n<90)?"bad":((n<94)?"warn":"");
    case "gluc":  return (n<60||n>250)?"bad":((n<80||n>180)?"warn":"");
  }
  return "";
}
function vmaStatus(k,v){
  const n=num(v); if(n===null) return "";
  switch(k){
    case "fio2":     return n>=80?"bad":(n>=60?"warn":"");
    case "peep":     return n>=16?"bad":(n>=14?"warn":"");
    case "pmeseta":  return n>=30?"bad":(n>=28?"warn":"");   // meta protectora < 30
    case "ppico":    return n>=40?"bad":(n>=35?"warn":"");
    case "autopeep": return n>=8?"bad":(n>0?"warn":"");
    case "vtkg":     return n>10?"bad":(n>8?"warn":"");       // 6–8 mL/kg predicho
    case "etco2":    return (n<25||n>55)?"bad":((n<30||n>45)?"warn":"");
    case "globo":    return (n>30||n<20)?"warn":"";           // 20–30 cmH₂O
  }
  return "";
}
/* Valores que no se capturan: se calculan del propio registro. */
function vmaDerived(r,p){
  const out=[];
  const ib=pbwOf(p);
  if(r){
  const peep=num(r.peep), pm=num(r.pmeseta), pp=num(r.ppico), vt=num(r.vt);
  /* Vt/kg contra peso predicho: si alguien lo tecleó a mano se respeta ese valor. */
  if(ib && vt!==null && num(r.vtkg)===null){
    const v=r1(vt/ib);
    out.push({label:"Vt/kg PP",value:v+" mL/kg",st:vmaStatus("vtkg",v)});
  }
  if(pm!==null&&peep!==null){
    const dp=Math.round((pm-peep)*10)/10;
    out.push({label:"ΔP",value:dp+" cmH₂O",st:dp>=15?"bad":(dp>=13?"warn":"")});
    if(vt!==null&&dp>0){
      const c=Math.round(vt/dp*10)/10;
      out.push({label:"C estática",value:c+" mL/cmH₂O",st:c<30?"warn":""});
    }
  }
  if(pp!==null&&pm!==null){
    const pr=Math.round((pp-pm)*10)/10;
    out.push({label:"P. resistiva",value:pr+" cmH₂O",st:pr>=15?"warn":""});
  }
  }
  if(ib) out.push({label:"Vt meta 6–8 mL/kg",value:Math.round(6*ib)+"–"+Math.round(8*ib)+" mL"});
  return out;
}

/* ---------------- somatometría ---------------- */
/* Sexo capturado como texto libre ("M", "F", "masculino", "mujer"…). Se prueba "mu"
   antes que "m" para que "mujer" no se lea como masculino. Sin sexo claro devuelve
   null y las fórmulas que dependen de él no se calculan. */
function sexOf(p){ const s=norm(p&&p.sex).trim(); if(/^(f|mu)/.test(s)) return "F"; if(/^(m|h|v)/.test(s)) return "M"; return null; }
function pesoKg(p){ const n=num(p&&p.peso); return n&&n>0&&n<400?n:null; }
/* Acepta la talla en metros ("1.70") además de en centímetros. */
function tallaCm(p){ let n=num(p&&p.talla); if(!n||n<=0) return null; if(n<3) n*=100; return n>=100&&n<=250?n:null; }
/* Peso predicho ARDSNet: misma fórmula que guardia_mi.html (pulgadas, piso en 60"). */
function pbw(sexo,cm){ const inch=cm/2.54; const over=Math.max(inch-60,0); return (sexo==="M"?50:45.5)+2.3*over; }
function pbwOf(p){ const s=sexOf(p), t=tallaCm(p); return s&&t?pbw(s,t):null; }
function imcOf(p){ const w=pesoKg(p), t=tallaCm(p); return w&&t?w/Math.pow(t/100,2):null; }
/* Peso para dosificar: el real, salvo que pase de 130 % del peso predicho; entonces
   el ajustado (PBW + 0.4 × exceso). Mismo criterio que guardia_mi.html. */
function dosingWeight(p){
  const w=pesoKg(p); if(!w) return null;
  const ib=pbwOf(p);
  if(ib && w>1.3*ib) return {kg:ib+0.4*(w-ib), tipo:"ajustado"};
  return {kg:w, tipo:"real"};
}
function r1(x){ return Math.round(x*10)/10; }
function drvRow(list){
  return list.length?`<div class="drv-row">${list.map(x=>`<span class="drv ${x.st||""}"><em>${esc(x.label)}</em>${esc(String(x.value))}</span>`).join("")}</div>`:"";
}
function somaList(p){
  const w=pesoKg(p), t=tallaCm(p), ib=pbwOf(p), imc=imcOf(p), out=[];
  if(w) out.push({label:"Peso",value:r1(w)+" kg"});
  if(t) out.push({label:"Talla",value:Math.round(t)+" cm"});
  if(imc) out.push({label:"IMC",value:r1(imc),st:(imc<18.5||imc>=30)?"warn":""});
  if(ib) out.push({label:"Peso predicho",value:r1(ib)+" kg"});
  else if(t) out.push({label:"Peso predicho",value:"falta el sexo",st:"warn"});
  return out;
}
/* Diuresis a mL/kg/h. El campo es texto libre: si ya trae "kg" se respeta tal cual.
   Si no, el número son mL y la ventana es la que diga el texto ("350 en 6h", "/8 h");
   sin ventana se asume 24 h, y se muestra para que no quede implícita. */
function diuresisRate(p,v){
  if(!v||!v.diuresis) return null;
  let t=norm(v.diuresis);
  if(/kg/.test(t)) return null;
  const w=pesoKg(p); if(!w) return null;
  let h=24;
  const hm=t.match(/(\d+(?:[.,]\d+)?)\s*(?:h|hr|hrs|hora|horas)\b/);
  if(hm){ const x=parseFloat(hm[1].replace(",",".")); if(x>=1&&x<=72) h=x; t=t.replace(hm[0]," "); }
  const m=t.match(/\d+(?:[.,]\d+)?/); if(!m) return null;
  let ml=parseFloat(m[0].replace(",","."));
  if(/\d\s*(l|lt|lts|litros?)\b/.test(t) && !/ml/.test(t)) ml*=1000;
  const rate=ml/w/h;
  /* KDIGO: < 0.5 mL/kg/h define oliguria; < 0.3 es estadio 3. */
  return {value:Math.round(rate*100)/100, h:r1(h), st:rate<0.3?"bad":(rate<0.5?"warn":"")};
}

/* ---------------- semáforo de laboratorios ---------------- */
/* Rangos de adulto en las unidades que muestra cada campo. lo/hi: límites normales
   (fuera = ámbar). blo/bhi: valores que piden acción (rojo; bhi cuenta desde el valor).
   Donde el sexo cambia el rango va en M/F; sin sexo claro se usa la unión de ambos
   para no marcar de más. Ajustables a los rangos del laboratorio del hospital. */
const LAB_REF={
  urea:{hi:45,bhi:150}, bun:{hi:20,bhi:70},
  cr:{M:{hi:1.3},F:{hi:1.1},bhi:4.0},                 // ≥ 4.0: criterio de KDIGO 3
  au:{M:{hi:7.0},F:{hi:6.0}}, col:{hi:200},
  tg:{hi:150,bhi:1000},                               // ≥ 1000: riesgo de pancreatitis
  bt:{hi:1.2,bhi:6.0}, bd:{hi:0.3}, bi:{hi:1.0},      // BT ≥ 6: SOFA hepático ≥ 3
  prot:{lo:6.0,hi:8.3}, glob:{lo:2.0,hi:3.5}, ag:{lo:1.0,hi:2.5},
  alb:{lo:3.5,hi:5.0,blo:2.0},
  tgo:{hi:40,bhi:1000}, tgp:{hi:40,bhi:1000},         // ≥ 1000: hepatitis aguda / isquémica
  fa:{hi:130}, dhl:{hi:250}, ggt:{M:{hi:60},F:{hi:40}},
  ca:{lo:8.5,hi:10.5,blo:7.0,bhi:12.0}, p:{lo:2.5,hi:4.5,blo:1.0,bhi:8.0},
  cl:{lo:98,hi:107,blo:85,bhi:120}, k:{lo:3.5,hi:5.0,blo:3.0,bhi:6.0},
  na:{lo:135,hi:145,blo:125,bhi:155}, mg:{lo:1.7,hi:2.4,blo:1.2,bhi:4.0},
  pcr:{hi:10,bhi:100}, pct:{hi:0.5,bhi:2.0},
  leu:{lo:4.5,hi:11,blo:2.0,bhi:30}, neu:{lo:40,hi:75},
  eri:{M:{lo:4.5,hi:5.9},F:{lo:4.0,hi:5.2}},
  hb:{M:{lo:13.5,hi:17.5},F:{lo:12.0,hi:15.5},blo:7.0,bhi:20},   // < 7: umbral transfusional
  hto:{M:{lo:41,hi:53},F:{lo:36,hi:46},blo:21,bhi:60},
  vcm:{lo:80,hi:100}, hcm:{lo:27,hi:33}, chcm:{lo:32,hi:36}, rdw:{hi:14.5},
  plaq:{lo:150,hi:450,blo:50,bhi:1000},
  tp:{hi:14}, inr:{hi:1.2,bhi:5.0}, tpt:{hi:35,bhi:100},
  fib:{lo:200,hi:400,blo:100}, dd:{hi:500},
  ph:{lo:7.35,hi:7.45,blo:7.20,bhi:7.55}, pco2:{lo:35,hi:45,blo:20,bhi:70}, po2:{lo:80,blo:60},
  hco3:{lo:22,hi:26,blo:15,bhi:40}, hco3std:{lo:22,hi:26,blo:15,bhi:40}, tco2:{lo:23,hi:29,blo:15,bhi:40},
  beecf:{lo:-2,hi:2,blo:-10,bhi:10}, beb:{lo:-2,hi:2,blo:-10,bhi:10},
  so2:{lo:94,blo:90}, lactato:{hi:2.0,bhi:4.0},       // ≥ 4: Surviving Sepsis
};
/* En gasometría venosa el pH baja y la pCO₂ sube; pO₂ y SO₂ venosas no se califican. */
const LAB_REF_VEN={ ph:{lo:7.31,hi:7.41,blo:7.20,bhi:7.55}, pco2:{lo:41,hi:51,blo:20,bhi:75}, po2:null, so2:null };
/* Leucocitos y plaquetas llegan a veces en absolutos (18,400 / 95,000) y no en ×10³;
   el dímero D a veces en µg/mL. Sólo para calificar: el valor guardado no se toca.
   En plaquetas el corte es 5000 porque entre 1000 y 5000 cualquiera de las dos
   lecturas ya es roja, así que la ambigüedad no cambia el color. */
function labNum(k,v){
  let n=num(v); if(n===null) return null;
  if(k==="leu" && n>=500) n/=1000;
  if(k==="plaq" && n>=5000) n/=1000;
  if(k==="dd" && n>0 && n<20) n*=1000;
  return n;
}
function labRef(k,p,rec){
  if(rec && /ven/.test(norm(rec.gtipo||"")) && k in LAB_REF_VEN) return LAB_REF_VEN[k];
  const r=LAB_REF[k];
  if(!r||!r.M) return r||null;
  const s=sexOf(p);
  const base=s?r[s]:{
    lo:(r.M.lo!=null&&r.F.lo!=null)?Math.min(r.M.lo,r.F.lo):undefined,
    hi:(r.M.hi!=null&&r.F.hi!=null)?Math.max(r.M.hi,r.F.hi):undefined };
  return Object.assign({},r,base);
}
function labStatus(k,v,p,rec){
  if(k==="glu") return svStatus("gluc",v);       // mismos cortes que la glucosa capilar
  const n=labNum(k,v); if(n===null) return "";
  const r=labRef(k,p,rec); if(!r) return "";
  if(r.blo!=null && n<r.blo) return "bad";
  if(r.bhi!=null && n>=r.bhi) return "bad";
  if((r.lo!=null && n<r.lo) || (r.hi!=null && n>r.hi)) return "warn";
  return "";
}
/* Dirección respecto al rango normal: la flecha ↑/↓ de la tabla de laboratorios de Edu. */
function labDir(k,v,p,rec){
  const n=labNum(k,v); if(n===null) return "";
  if(k==="glu") return n>180?"hi":(n<80?"lo":"");
  const r=labRef(k,p,rec); if(!r) return "";
  const hi=r.hi!=null?r.hi:r.bhi, lo=r.lo!=null?r.lo:r.blo;
  if(hi!=null&&n>hi) return "hi";
  if(lo!=null&&n<lo) return "lo";
  return "";
}
/* Cambio contra el set anterior, en las unidades que se ven ("+1.6", "−2.3"). Va en
   cifra y no en flecha para no confundirse con la flecha de fuera de rango. Si los
   dos sets vienen en escalas distintas (absolutos contra ×10³) no se compara. */
function decs(v){ const m=String(v).match(/[.,](\d+)/); return m?m[1].length:0; }
function deltaText(k,a,b){
  const x=num(a), y=num(b); if(x===null||y===null||x===0||y===0) return "";
  if(Math.abs(labNum(k,a)/x-labNum(k,b)/y)>1e-9) return "";
  const d=x-y; if(d===0) return "";
  const t=Math.abs(d).toFixed(Math.min(2,Math.max(decs(a),decs(b)))).replace(/\B(?=(\d{3})+(?!\d))/g," ");
  return `<span class="delta">${d>0?"+":"−"}${t}</span>`;
}
/* Cálculos sobre el último set: lo que se saca a mano en el pase. */
function agSt(x){ return x>=20?"bad":(x>12?"warn":""); }
function labDerived(r,p){
  if(!r) return [];
  const n=k=>labNum(k,r[k]), out=[];
  const na=n("na"), cl=n("cl"), alb=n("alb"), glu=n("glu"), ca=n("ca"), cr=n("cr");
  const hco3=n("hco3")!==null?n("hco3"):n("tco2");
  const bun=n("bun")!==null?n("bun"):(n("urea")!==null?n("urea")/2.14:null);
  if(na!==null&&cl!==null&&hco3!==null){
    const ag=na-(cl+hco3);
    if(alb!==null&&alb<4){ const agc=ag+2.5*(4-alb); out.push({label:"Anion gap",value:r1(ag)+" · corr. alb "+r1(agc),st:agSt(agc)}); }
    else out.push({label:"Anion gap",value:r1(ag),st:agSt(ag)});
  }
  if(na!==null&&glu!==null&&glu>=200){                // Katz: 1.6 mEq/L por cada 100 mg/dL
    const nac=na+1.6*(glu-100)/100;
    out.push({label:"Na corregido",value:r1(nac)+" mEq/L",st:labStatus("na",nac,p)});
  }
  if(ca!==null&&alb!==null&&alb<4){
    const cac=ca+0.8*(4-alb);
    out.push({label:"Ca corregido",value:r1(cac)+" mg/dL",st:labStatus("ca",cac,p)});
  }
  if(na!==null&&glu!==null&&bun!==null){
    const osm=2*na+glu/18+bun/2.8;
    out.push({label:"Osm calculada",value:Math.round(osm)+" mOsm/L",st:(osm>320||osm<250)?"bad":((osm>295||osm<275)?"warn":"")});
  }
  /* Cockcroft-Gault con el peso de dosificación. */
  const age=num(p.age), sx=sexOf(p), dw=dosingWeight(p);
  if(cr&&age&&sx&&dw){
    let v=(140-age)*dw.kg/(72*cr); if(sx==="F") v*=0.85;
    out.push({label:"Dep. Cr (C-G)",value:Math.round(v)+" mL/min"+(dw.tipo==="ajustado"?" · peso ajust.":""),st:v<30?"bad":(v<60?"warn":"")});
  }
  return out;
}
/* Rojos del último set, para verlos desde el censo sin abrir al paciente. */
function critChip(p){
  const recs=p.labs||[]; if(!recs.length) return "";
  const r=recs[recs.length-1];
  const bad=LAB_FIELDS.filter(f=>!f.text&&r[f.k]&&labStatus(f.k,r[f.k],p,r)==="bad").map(f=>f.label+" "+r[f.k]);
  if(!bad.length) return "";
  const txt=bad.slice(0,3).join(" · ")+(bad.length>3?` +${bad.length-3}`:"");
  const when=dayKey(r.ts)===todayStr()?"":` (${fmtShort(r.ts)})`;
  return `<span class="chip crit">Crítico · ${esc(txt+when)}</span>`;
}

/* ---------------- render principal (layout web app) ---------------- */
const isDesktop=()=>window.matchMedia("(min-width:900px)").matches;
function render(){
  if(!selectedId && isDesktop()){
    const it=visiblePatients();
    if(it.length) selectedId=(it.find(p=>!seenToday(p))||it[0]).id;
  }
  if(selectedId && !find(selectedId)) selectedId=null;
  document.body.classList.toggle("has-sel",!!selectedId);
  renderSummary(); renderList(); renderDetail();
}

function renderSummary(){
  const f=new Date().toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
  document.getElementById("today").textContent = "SynapMed · "+f.charAt(0).toUpperCase()+f.slice(1);
  const P=state.patients.filter(p=>!p.alta), altas=state.patients.length-P.length;
  const porVer=P.filter(p=>!seenToday(p)).length;
  const sinSV=P.filter(p=>!lastVitalsToday(p)).length;
  const pend=P.reduce((a,p)=>a+openPend(p),0);
  document.getElementById("s-porver").textContent=porVer;
  document.getElementById("s-sinsv").textContent=sinSV;
  document.getElementById("s-pend").textContent=pend;

  const total=P.length, vistos=P.filter(seenToday).length, pct=total?Math.round(vistos/total*100):0;
  document.getElementById("ring").style.setProperty("--pct",pct);
  document.getElementById("ring-pct").textContent=pct+"%";
  document.getElementById("board-h").textContent = total? `${vistos} de ${total} pacientes vistos` : "Sin pacientes todavía";
  document.getElementById("board-p").textContent = !total ? "Agrega el primero con “Nuevo paciente”."
    : (porVer? `Faltan ${porVer} por pasar${pend?` · ${pend} pendiente${pend>1?"s":""} abierto${pend>1?"s":""}`:""}`
             : (pend? `Pase completo · ${pend} pendiente${pend>1?"s":""} por resolver` : "Pase completo, sin pendientes"));

  const counts={ todos:total, porver:porVer, sinsv:sinSV, pend:P.filter(p=>openPend(p)>0).length, alta:altas };
  const tabsDef=[["todos","Todos"],["porver","Por ver"],["sinsv","Sin SV hoy"],["pend","Con pendientes"]].concat(altas||filter==="alta"?[["alta","Altas"]]:[]);
  document.getElementById("tabs").innerHTML=tabsDef.map(([k,l])=>
    `<button class="tab ${filter===k?'active':''}" onclick="setFilter('${k}')">${l}<span class="badge">${counts[k]}</span></button>`).join("");

  document.querySelectorAll(".stat").forEach(s=>s.classList.remove("on"));
  const map={porver:0,sinsv:1,pend:2};
  if(filter in map) document.querySelectorAll(".stat")[map[filter]].classList.add("on");
}

function matchesQuery(p){
  if(!query) return true;
  const meds=activeMeds(p).map(m=>m.name).join(" ");
  const hay=norm([p.name,p.bed,p.dx,p.att,p.sex,p.presentation,meds].filter(Boolean).join(" "));
  return query.split(/\s+/).every(t=>hay.includes(t));
}

function passFilter(p){
  if(filter==="alta") return !!p.alta;
  if(p.alta) return false;
  if(filter==="porver") return !seenToday(p);
  if(filter==="sinsv") return !lastVitalsToday(p);
  if(filter==="pend") return openPend(p)>0;
  return true;
}
/* Censo en orden de cama (el orden del pase) y estable: marcar visto no mueve a nadie.
   El paciente abierto no se cae de la lista aunque deje de cumplir el filtro. */
function visiblePatients(){
  const items=state.patients.filter(p=>matchesQuery(p)&&(p.id===selectedId||passFilter(p)));
  items.sort((a,b)=>{
    const ea=!a.bed, eb=!b.bed; if(ea!==eb) return ea?1:-1;
    return String(a.bed||"").localeCompare(String(b.bed||""),"es",{numeric:true});
  });
  return items;
}
function selectPatient(id){ if(!find(id)) return; selectedId=id; render(); }
function closePatient(){ selectedId=null; render(); }
function navStep(d){
  const L=visiblePatients(), i=L.findIndex(p=>p.id===selectedId), n=L[i+d];
  if(n){ selectedId=n.id; render(); const r=document.querySelector('.prow[data-id="'+n.id+'"]'); if(r) r.scrollIntoView({block:"nearest"}); }
}

function renderList(){
  const list=document.getElementById("list");
  const keep=list.scrollTop;
  const items=visiblePatients();
  document.getElementById("list-count").textContent=
    `Censo · ${items.length} paciente${items.length===1?"":"s"}`;
  if(!items.length){
    const total=state.patients.length;
    list.innerHTML = !total
      ? `<div class="empty"><span class="big">${EDU_ICON.cama}</span><b>Empieza tu pase</b>Agrega tu primer paciente con el botón azul de abajo.</div>`
      : (query
        ? `<div class="empty"><span class="big">${EDU_ICON.paciente}</span><b>Sin resultados</b>Ningún paciente coincide con “${esc(queryRaw)}”.</div>`
        : `<div class="empty"><span class="big">${EDU_ICON.criterio}</span><b>Nada en este filtro</b>Cambia de filtro para ver el resto de los pacientes.</div>`);
    return;
  }
  list.innerHTML=items.map(rowHTML).join("");
  list.scrollTop=keep;
}

function rowHTML(p){
  const op=openPend(p), onV=!!p.onVMA, seen=seenToday(p), sel=p.id===selectedId;
  const sub=[p.age?esc(p.age)+" años":"",esc(p.sex||""),p.att?esc(p.att):""].filter(Boolean).join(" · ");
  const noSV=!lastVitalsToday(p);
  return `<div class="prow ${sel?'sel':''} ${seen?'done':''}" data-id="${p.id}" tabindex="0" role="button" aria-current="${sel}"
      onclick="selectPatient('${p.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectPatient('${p.id}')}">
    <button class="check ${seen?'on':''}" onclick="event.stopPropagation();toggleSeen('${p.id}')"
      title="${seen?'Marcar como no visto':'Marcar como visto'}" aria-label="Marcar visto">${checkSVG()}</button>
    <div class="prow-main">
      <div class="pt-top">
        ${p.bed?`<span class="bedchip" aria-label="Cama ${esc(p.bed)}">${esc(p.bed)}</span>`:""}
        <span class="pt-name">${esc(p.name)||"(sin nombre)"}</span>
      </div>
      ${sub?`<div class="pt-sub">${sub}</div>`:""}
      ${p.dx?`<div class="pt-dx">${esc(p.dx)}</div>`:""}
      <div class="chips">
        ${critChip(p)}
        ${p.alta?`<span class="chip file">Alta ${fmtShort(p.alta)}</span>`:""}
        ${!p.alta&&seen&&p.seenAt?`<span class="seen-tag">Visto ${fmtHour(p.seenAt)}</span>`:""}
        ${onV?`<span class="chip vma">● VMA</span>`:""}
        ${noSV&&!seen&&!p.alta?`<span class="sv-pending" style="margin-top:0">SV pendientes</span>`:""}
        ${op?`<span class="chip pend">${op} pendiente${op>1?"s":""}</span>`:""}
      </div>
    </div>
  </div>`;
}

function renderDetail(){
  const main=document.getElementById("main");
  const p=selectedId&&find(selectedId);
  if(!p){
    main.dataset.pid="";
    main.innerHTML=`<div class="main-empty"><span class="big">${EDU_ICON.paciente}</span>
      <b>${state.patients.length?"Selecciona un paciente":"Sin pacientes todavía"}</b>
      ${state.patients.length?`Elige a alguien del censo para ver y capturar su pase. Con <span class="kbd">←</span> <span class="kbd">→</span> cambias de paciente.`:"Agrega el primero con “Nuevo paciente”."}</div>`;
    return;
  }
  const old=main.querySelector(".pane-area");
  const keep=(main.dataset.pid===p.id&&old)?old.scrollTop:0;
  main.innerHTML=detailHTML(p);
  main.dataset.pid=p.id;
  const pa=main.querySelector(".pane-area"); if(pa) pa.scrollTop=keep;
}

          <button class="arrow" onclick="navStep(1)" ${i<0||i>=L.length-1?"disabled":""} aria-label="Paciente siguiente" title="Siguiente (→)">${ARROW_R}</button>
          ${p.alta
            ?`<button class="btn primary grow" onclick="reingresar('${p.id}')">Reingresar paciente</button>`
            :`<button class="btn ghost sm" onclick="darAlta('${p.id}')">Dar de alta</button>

        </div>
      </div>
      ${p.alta?`<div class="sbar warn" style="margin:12px 0 0">${EDU_ICON.alerta}<span class="sbar-msg">Paciente dado de alta el ${fmtTime(p.alta)}. Sus datos se conservan; ya no cuenta en el pase.</span></div>`:""}
      ${sub?`<div class="pt-sub">${sub}</div>`:""}

      <div class="chips">

        ${ai?`<span class="chip inf">${ai} ${ai>1?"infusiones":"infusión"}</span>`:""}
        ${am?`<span class="chip med">${am} ${am>1?"medicamentos":"medicamento"}</span>`:""}
        <span class="chip ${op?'pend':'pend-0'}">${op?op+" pendiente"+(op>1?"s":""):"Sin pendientes"}</span>

      </div>
      <div class="seg" role="tablist">
        ${segBtn(p,'pres','Presentación','')}
        ${segBtn(p,'sv','Signos vitales','')}

        ${segBtn(p,'vma','VMA',onV?`<span class="dotv"></span>`:'')}
        ${segBtn(p,'inf','Infusiones',ai?`<span class="cnt">${ai}</span>`:'')}

function valueTiles(rec,fields,statusFn){
  if(!rec) return `<div class="muted-note">Aún no hay datos registrados.</div>`;
  const tiles=fields.filter(f=>rec[f.k]).map(f=>{
    const st=statusFn?statusFn(f.k,rec[f.k]):"";
    return `<div class="vtile ${st}"><div class="vl">${f.label}</div><div class="vv">${esc(rec[f.k])}</div></div>`;
  }).join("");
  return tiles?`<div class="vtiles">${tiles}</div>`:`<div class="muted-note">Aún no hay datos registrados.</div>`;
}
function histRows(records,fields){
  const rows=(records||[]).slice(0,-1).slice(-5).reverse().map(v=>{
    const vals=fields.filter(f=>v[f.k]).map(f=>`${f.label} ${esc(v[f.k])}`).join(" · ");
    return `<div class="hrow"><div class="ht">${fmtTime(v.ts)}</div><div class="hv">${vals||"—"}</div></div>`;
  }).join("");
  return rows?`<div class="sec-title">Historial</div><div class="hist">${rows}</div>`:"";
}
function formGroups(groups,prefix,id){
  return groups.map(g=>`<div class="sub-title">${g.g}</div>${formGrid(g.f,prefix,id)}`).join("");
}
function formGrid(fields,prefix,id){
  return `<div class="form-grid">`+fields.map(f=>
    `<label>${f.label}<input id="${prefix}-${id}-${f.k}" placeholder="${f.ph}" inputmode="${f.im||'decimal'}" autocomplete="off"></label>`
  ).join("")+`</div>`;
}

function svPaneHTML(p){

function labsPaneHTML(p){
  const d=labDraft[p.id]||{text:"",parsed:null};
  const manual=manualLabs.has(p.id);
  let preview="";
  if(d.parsed){
    const hits=LAB_FIELDS.filter(f=>d.parsed.rec[f.k]!==undefined && f.k!=="gtipo");
    preview=`<div class="pv-box">
      <div class="pv-head">${hits.length} valor${hits.length===1?"":"es"} reconocido${hits.length===1?"":"s"}${d.parsed.rec.gtipo?` · gasometría ${esc(d.parsed.rec.gtipo)}`:""}</div>
      ${hits.length?`<div class="pv-chips">${hits.map(f=>{ const v=d.parsed.rec[f.k], st=labStatus(f.k,v,p,d.parsed.rec), dir=st?labDir(f.k,v,p,d.parsed.rec):"";
        return `<span class="pvc ${st}"><em>${f.label}</em><span class="num ${dir}">${esc(v)}</span></span>`; }).join("")}</div>`:`<div class="muted-note">No se reconoció ningún valor. Revisa que cada dato venga como “Etiqueta valor”.</div>`}
      ${d.parsed.unknown.length?`<div class="pv-warn">Sin reconocer: ${esc(d.parsed.unknown.slice(0,12).join(" · "))}</div>`:""}
      ${hits.length?`<button class="btn primary full mt" onclick="commitLabs('${p.id}')">Guardar set del ${new Date().toLocaleDateString("es-MX",{day:"2-digit",month:"2-digit"})}</button>`:""}

    ${manual?`${formGrid(LAB_FIELDS.filter(f=>!f.text),"lab",p.id)}
      <button class="btn primary full mt" onclick="saveLabs('${p.id}')">Guardar set capturado</button>`:`<div class="muted-note">Úsala solo para corregir o completar un valor suelto.</div>`}`;
}

function labsTable(p){
  const recs=(p.labs||[]);
  if(!recs.length) return `<div class="muted-note">Sin laboratorios. Pega el primer set abajo.</div>`;
  const show=recs.slice(-6).reverse();
  const header=`<th>Lab</th>`+show.map((r,i)=>`<th class="${i===0?'now':''}">${fmtShort(r.ts)}</th>`).join("");
  let body="";
  LAB_GROUPS.forEach(g=>{
    const fields=g.f.filter(f=>!f.text && show.some(r=>r[f.k]));
    if(!fields.length) return;
    body+=`<tr class="grp"><td class="lname">${g.g}</td><td colspan="${show.length}"></td></tr>`;
    body+=fields.map(f=>`<tr><td class="lname">${f.label}</td>`+show.map((r,i)=>{
      if(!r[f.k]) return `<td class="${i===0?'now':'old'}">—</td>`;
      const st=labStatus(f.k,r[f.k],p,r);
      const dir=st?labDir(f.k,r[f.k],p,r):"";
      const delta=(i===0&&show[1]&&show[1][f.k])?deltaText(f.k,r[f.k],show[1][f.k]):"";   // vs. el set anterior
      return `<td class="${i===0?'now':'old'}"><span class="num ${st} ${dir}">${esc(r[f.k])}</span>${delta}</td>`;
    }).join("")+`</tr>`).join("");
  });
  if(!body) return `<div class="muted-note">Sin valores para comparar.</div>`;
  const latest=show[0];
  const drv=labDerived(latest,p);
  return `<div class="table-wrap"><table class="labs-table"><thead><tr>${header}</tr></thead><tbody>${body}</tbody></table></div>
    ${drv.length?`<div class="sub-title">Cálculos del último set</div>${drvRow(drv)}`:""}
    <div class="add-row" style="margin-top:8px">
      <button class="btn ghost sm" style="flex:1" onclick="copyLabs('${p.id}',this)">Copiar último set en formato de nota</button>
      <button class="btn ghost sm" onclick="delLabSet('${p.id}','${latest.ts}')" title="Eliminar el set más reciente">Borrar último</button>
    </div>`;
}

function vmaPaneHTML(p){

/* ---------------- acciones ---------------- */
function setFilter(f){ filter=(filter===f&&f!=="todos")?"todos":f; render(); }
function onSearch(v){
  queryRaw=v.trim(); query=norm(queryRaw);
  document.getElementById("searchBox").classList.toggle("has",!!v);
  renderList();
}
function clearSearch(){ document.getElementById("q").value=""; onSearch(""); }

function setPane(id,pane){ openPanes[id]=pane; refresh(id); const pa=document.querySelector(".pane-area"); if(pa) pa.scrollTop=0; }
function darAlta(id){
  const p=find(id); if(!p) return;
  askConfirm("¿Dar de alta a "+(p.name||"este paciente")+"?","Saldrá del censo y del avance del pase. Sus datos se conservan en la pestaña «Altas» y puedes reingresarlo cuando quieras.","Sí, dar de alta",()=>{
    p.alta=new Date().toISOString(); p.seenDate=null; p.seenAt=null;
    if(selectedId===id) selectedId=null;
    if(save()) toast("Paciente dado de alta","ok"); render();
  });
}
function reingresar(id){
  const p=find(id); if(!p) return;
  delete p.alta; if(filter==="alta") filter="todos";
  if(save()) toast("Paciente reingresado","ok"); render();
}
function toggleSeen(id){
  const p=find(id); if(!p) return;
  if(seenToday(p)){ p.seenDate=null; p.seenAt=null; }
  else { p.seenDate=todayStr(); p.seenAt=new Date().toISOString(); }
  save(); render();
}
function savePres(id){
  const p=find(id); if(!p) return;
  const el=document.getElementById(`pres-${id}`); p.presentation=el?el.value:"";
  openPanes[id]="pres"; if(save()) toast("Presentación guardada","ok"); refresh(id);
}
function collectFields(fields,prefix,id){
  const rec={ts:new Date().toISOString()}; let any=false;
  fields.forEach(f=>{ const el=document.getElementById(`${prefix}-${id}-${f.k}`); const val=el?el.value.trim():""; if(val){ rec[f.k]=val; any=true; } });
  return any?rec:null;
}
function saveVitals(id){
  const p=find(id); if(!p) return;
  const rec=collectFields(SV_FIELDS,"sv",id);
  if(!rec){ toast("Escribe al menos un valor","err"); return; }
  p.vitals=p.vitals||[]; p.vitals.push(rec); openPanes[id]="sv";
  if(save()) toast("Signos vitales guardados","ok");
  render();
}
function saveLabs(id){
  const p=find(id); if(!p) return;
  const rec=collectFields(LAB_FIELDS.filter(f=>!f.text),"lab",id);
  if(!rec){ toast("Captura al menos un laboratorio","err"); return; }
  p.labs=p.labs||[]; p.labs.push(rec); openPanes[id]="labs";
  if(save()) toast("Set capturado guardado","ok");
  refresh(id);
}
function previewLabs(id){
  const el=document.getElementById(`paste-${id}`); if(!el) return;
  const text=el.value;
  labDraft[id]={text, parsed:parseLabText(text)};
  openPanes[id]="labs"; refresh(id);
}
function clearLabDraft(id){ delete labDraft[id]; openPanes[id]="labs"; refresh(id); }
function toggleManual(id){ manualLabs.has(id)?manualLabs.delete(id):manualLabs.add(id); openPanes[id]="labs"; refresh(id); }
function commitLabs(id){
  const p=find(id), d=labDraft[id]; if(!p||!d||!d.parsed) return;
  const rec=Object.assign({ts:new Date().toISOString()}, d.parsed.rec);
  const keys=Object.keys(rec).filter(k=>k!=="ts"&&k!=="gtipo");
  if(!keys.length){ toast("No hay valores que guardar","err"); return; }
  p.labs=p.labs||[]; p.labs.push(rec);
  delete labDraft[id]; openPanes[id]="labs";
  if(save()) toast(`${keys.length} laboratorios guardados`,"ok");
  refresh(id);
}
function delLabSet(id,ts){
  const p=find(id); if(!p) return;
  askConfirm("¿Eliminar el último set?","Se borrará el set de laboratorios más reciente de este paciente.","Sí, eliminar",()=>{
    p.labs=(p.labs||[]).filter(r=>r.ts!==ts); openPanes[id]="labs"; save(); refresh(id); toast("Set eliminado");
  });
}
function copyLabs(id,btn){
  const p=find(id); const recs=(p&&p.labs)||[]; if(!recs.length) return;
  const txt=labsToText(recs[recs.length-1]);
  const done=()=>{ if(btn){ const o=btn.textContent; btn.textContent="Copiado"; setTimeout(()=>{ btn.textContent=o; },1400);} };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt,done);
}
function saveVMA(id){
  const p=find(id); if(!p) return;
  const rec=collectFields(VMA_FIELDS,"vma",id);
  if(!rec){ toast("Escribe al menos un parámetro","err"); return; }
  p.vma=p.vma||[]; p.vma.push(rec); p.onVMA=true; openPanes[id]="vma";
  if(save()) toast("Parámetros VMA guardados","ok");
  refresh(id);
}
function setVMAoff(id){ const p=find(id); if(!p) return; p.onVMA=false; openPanes[id]="vma"; save(); toast("Marcado como extubado"); refresh(id); }

function addInf(id){
  const p=find(id); if(!p) return;
  const n=document.getElementById(`in-${id}`), dd=document.getElementById(`id-${id}`);
  const name=n?n.value.trim():"", dose=dd?dd.value.trim():"";
  if(!name){ if(n) n.focus(); return; }
  p.infusiones=p.infusiones||[]; p.infusiones.push({id:uid(),name,dose,active:true});
  openPanes[id]="inf"; save(); refresh(id);
  const el=document.getElementById(`in-${id}`); if(el) el.focus();
}
function toggleInf(pid,iid){ const p=find(pid); if(!p) return; const it=(p.infusiones||[]).find(x=>x.id===iid); if(!it) return; it.active=it.active===false; openPanes[pid]="inf"; save(); refresh(pid); }
function delInf(pid,iid){ const p=find(pid); if(!p) return; p.infusiones=(p.infusiones||[]).filter(x=>x.id!==iid); openPanes[pid]="inf"; save(); refresh(pid); }

function addMed(id){
  const p=find(id); if(!p) return;
  const g=k=>{ const e=document.getElementById(`${k}-${id}`); return e?e.value.trim():""; };
  const name=g("mn");
  if(!name){ const e=document.getElementById(`mn-${id}`); if(e) e.focus(); return; }
  p.medicamentos=p.medicamentos||[];
  p.medicamentos.push({id:uid(),name,dose:g("md"),via:g("mv"),freq:g("mf"),active:true,ts:new Date().toISOString()});
  openPanes[id]="meds"; save(); refresh(id);
  const e2=document.getElementById(`mn-${id}`); if(e2) e2.focus();
}
function toggleMed(pid,mid){ const p=find(pid); if(!p) return; const it=(p.medicamentos||[]).find(x=>x.id===mid); if(!it) return; it.active=it.active===false; openPanes[pid]="meds"; save(); refresh(pid); }
function delMed(pid,mid){ const p=find(pid); if(!p) return; p.medicamentos=(p.medicamentos||[]).filter(x=>x.id!==mid); openPanes[pid]="meds"; save(); refresh(pid); }
function copyMeds(id,btn){
  const p=find(id); if(!p) return;
  const act=activeMeds(p); if(!act.length){ toast("No hay medicamentos activos","err"); return; }
  const txt=act.map((m,i)=>`${i+1}. ${medText(m)}`).join("\n");
  const done=()=>{ if(btn){ const o=btn.textContent; btn.textContent="Copiado"; setTimeout(()=>{ btn.textContent=o; },1400); } };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt,done);
}

function addPend(id){

  if(!text){ if(el) el.focus(); return; }
